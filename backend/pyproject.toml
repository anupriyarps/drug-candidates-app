[project]
name = "drug-candidates-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<2",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<24",
  "email-validator>=2,<3",
  "redis>=5,<6",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "aiosqlite>=0.20,<1",
  "pytest-cov>=6,<7",
]
dev = [
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "aiosqlite>=0.20,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
